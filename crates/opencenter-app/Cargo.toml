[package]
name = "opencenter"
version = "0.1.0"
edition = "2021"
description = "Linux Control Center & System Tray for Elgato Key Lights"

[dependencies]
opencenter-core = { path = "../opencenter-core" }
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time", "sync"] }
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.36.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
ksni = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
