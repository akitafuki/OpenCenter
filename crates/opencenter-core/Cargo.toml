[package]
name = "opencenter-core"
version = "0.1.0"
edition = "2021"
description = "Core library for OpenCenter Elgato Key Light control"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
anyhow = "1.0"
mdns-sd = "0.11"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.10"
