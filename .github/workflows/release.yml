name: Release

on:
  push:
    tags:
      - 'v*'
    branches-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libx11-dev libxkbcommon-dev zip dpkg-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Workspace Binaries (Release)
        run: cargo build --release --workspace

      - name: Package OpenDeck Plugin
        run: |
          chmod +x package-opendeck.sh
          ./package-opendeck.sh

      - name: Assemble Release Artifacts
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          mkdir -p dist

          # 1. Main Application Tarball (.tar.gz)
          mkdir -p release_bundle
          cp target/release/opencenter release_bundle/
          cp install.sh README.md LICENSE release_bundle/
          tar -czf "dist/opencenter-${TAG}-linux-x86_64.tar.gz" -C release_bundle .
          rm -rf release_bundle

          # 2. Debian Package (.deb)
          chmod +x scripts/package_deb.sh
          ./scripts/package_deb.sh "${TAG}" dist

          # 3. OpenDeck Plugin Zip File
          cp opencenter-opendeck.zip dist/opencenter-opendeck.zip

          # 4. Checksums
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "OpenCenter ${{ github.ref_name }}" \
            --generate-notes
