name: Release

on:
  push:
    tags:
      - 'v*'
    branches-ignore:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-release:
    name: Build & Release Artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libdbus-1-dev libx11-dev libxkbcommon-dev zip dpkg-dev

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Build Workspace Binaries (Release)
        run: cargo build --release --workspace

      - name: Package OpenDeck Plugin
        run: |
          chmod +x package-opendeck.sh
          ./package-opendeck.sh

      - name: Assemble Release Artifacts
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"

          mkdir -p dist

          # 1. Main Application Tarball (.tar.gz)
          mkdir -p release_bundle
          cp target/release/opencenter release_bundle/
          cp install.sh README.md LICENSE release_bundle/
          tar -czf "dist/opencenter-${TAG}-linux-x86_64.tar.gz" -C release_bundle .

          # 2. Debian Package (.deb)
          DEB_DIR="deb_pkg/opencenter_${VERSION}_amd64"
          mkdir -p "${DEB_DIR}/DEBIAN"
          mkdir -p "${DEB_DIR}/usr/bin"
          mkdir -p "${DEB_DIR}/usr/share/applications"
          mkdir -p "${DEB_DIR}/usr/share/icons/hicolor/256x256/apps"
          mkdir -p "${DEB_DIR}/usr/lib/systemd/user"

          cp target/release/opencenter "${DEB_DIR}/usr/bin/opencenter"
          chmod 755 "${DEB_DIR}/usr/bin/opencenter"

          cat << 'DESK' > "${DEB_DIR}/usr/share/applications/opencenter.desktop"
[Desktop Entry]
Name=OpenCenter
Comment=Control Center & System Tray for Elgato Key Lights
Exec=opencenter gui
Icon=opencenter
Terminal=false
Type=Application
Categories=Utility;HardwareSettings;
DESK

          cp crates/opencenter-opendeck/assets/icon@2x.png "${DEB_DIR}/usr/share/icons/hicolor/256x256/apps/opencenter.png"

          cat << 'SERV' > "${DEB_DIR}/usr/lib/systemd/user/opencenter.service"
[Unit]
Description=OpenCenter - Linux Control Center & System Tray for Elgato Key Lights
After=network.target

[Service]
ExecStart=/usr/bin/opencenter gui
Restart=on-failure
RestartSec=5s

[Install]
WantedBy=default.target
SERV

          cat << CTRL > "${DEB_DIR}/DEBIAN/control"
Package: opencenter
Version: ${VERSION}
Section: utils
Priority: optional
Architecture: amd64
Maintainer: Jimmie Maggard Jr <https://github.com/akitafuki/OpenCenter>
Depends: libdbus-1-3, libx11-6, libxkbcommon0
Description: Control Elgato Key Lights locally on Linux with OpenCenter
 OpenCenter is a fast, lightweight Linux control center for Elgato Key Lights,
 Key Light Air, Key Light Mini, and Light Strips. Provides a native desktop
 GUI, DBus system tray applet, CLI automation, and OpenDeck integration.
CTRL

          dpkg-deb --build "${DEB_DIR}" "dist/opencenter_${VERSION}_amd64.deb"

          # 3. OpenDeck Plugin Zip File
          cp opencenter-opendeck.zip dist/opencenter-opendeck.zip

          # 4. Checksums
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "OpenCenter ${{ github.ref_name }}" \
            --generate-notes
